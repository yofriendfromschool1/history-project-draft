<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository README Viewer</title>
    <!-- Use local marked library and memory data -->
    <script src="marked.min.js"></script>
    <script src="repos_data.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --surface-color: rgba(30, 30, 30, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-color: #6366f1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .markdown-body {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface-color);
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.3em;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }

        pre {
            background-color: #0d1117;
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        code {
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 85%;
            background-color: rgba(110, 118, 129, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 6px;
        }

        pre code {
            background-color: transparent;
            padding: 0;
        }

        blockquote {
            padding: 0 1em;
            color: var(--text-secondary);
            border-left: 0.25em solid rgba(255, 255, 255, 0.2);
            margin: 0 0 16px 0;
        }

        table {
            border-spacing: 0;
            border-collapse: collapse;
            width: 100%;
            margin-top: 0;
            margin-bottom: 16px;
        }

        table th, table td {
            padding: 6px 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        img {
            max-width: 100%;
            box-sizing: content-box;
            background-color: var(--surface-color);
        }

        hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: rgba(255, 255, 255, 0.2);
            border: 0;
        }
        
        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="content" class="markdown-body">
        <div class="loading">Fetching README.md...</div>
    </div>

    <script>
        // Extract the repo query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const repoParam = urlParams.get('repo');
        const contentDiv = document.getElementById('content');

        if (!repoParam || typeof repoReadmes === 'undefined' || !repoReadmes[repoParam]) {
            contentDiv.innerHTML = `<h1>Error Loading Repository</h1><p>Could not load the documentation for <code>${repoParam || 'Unknown'}</code>. The repository may not have a README.md file, or the file is inaccessible.</p>`;
        } else {
            try {
                // Convert stored markdown string from repos_data.js to HTML directly
                const html = marked.parse(repoReadmes[repoParam]);
                contentDiv.innerHTML = html;
            } catch (error) {
                contentDiv.innerHTML = `<h1>Error Parsing Documentation</h1><p><small>${error.message}</small></p>`;
            }
        }
    </script>
</body>
</html>
